name: Daily R2 Republish (03:30 IST)

on:
  schedule:
    - cron: "0 22 * * *"   # 22:00 UTC = roz RAAT 03:30 IST (SIRF yahi automatic run)
  workflow_dispatch:
    inputs:
      movie_id:
        description: "Sirf yeh movie republish karo (khaali chhodo = saari movies)"
        required: false
        default: ""

permissions:
  contents: write   # keepalive commit ke liye zaroori
  actions: write    # purane run logs delete karne ke liye (privacy)

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pymongo requests

      - name: Republish movies (sab ya single)
        id: republish
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
          TARGET_MOVIE_ID: ${{ github.event.inputs.movie_id }}
        run: python -u scripts/daily_republish.py

      # KEEPALIVE: har run pe last_run.txt commit hota hai.
      # Isse repo me hamesha "activity" rehti hai -> GitHub 60-din inactivity wala
      # scheduled-workflow auto-disable KABHI nahi lagega. Bonus: last run ka
      # status repo me hi dikhta hai.
      - name: Keepalive + run log commit
        if: always()
        run: |
          {
            echo "last_run_utc: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "last_run_ist: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S IST')"
            echo "result: ${{ steps.republish.outcome }}"
          } > last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt
          git commit -m "keepalive: republish run $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "nothing to commit"
          git push

      # 🧹 PRIVACY: public repo me purane run logs (movie IDs etc.) public dikhte hain.
      # Har run ke end me apne SE pehle ke 2 SABSE PURANE completed runs delete karo.
      # Apna current run delete NAHI hota (in-progress). Recent history debug ke liye rehti hai.
      - name: Purge oldest 2 run logs (privacy)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          repo = os.environ["REPO"]
          tok = os.environ["GH_TOKEN"]
          cur = os.environ["CURRENT_RUN"]
          def api(url, method="GET"):
              req = urllib.request.Request(url, method=method,
                  headers={"Authorization": "Bearer " + tok,
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              return urllib.request.urlopen(req, timeout=30)
          try:
              runs = json.load(api(f"https://api.github.com/repos/{repo}/actions/runs?status=completed&per_page=100")).get("workflow_runs", [])
              cands = [r for r in runs if str(r["id"]) != cur]
              cands.sort(key=lambda r: r.get("created_at") or "")
              deleted = 0
              for r in cands[:2]:
                  try:
                      api(f"https://api.github.com/repos/{repo}/actions/runs/{r['id']}", method="DELETE")
                      deleted += 1
                      print("deleted run", r["id"])
                  except Exception as e:
                      print("skip", r["id"], type(e).__name__)
              print("cleanup done:", deleted, "deleted")
          except Exception as e:
              print("cleanup err:", type(e).__name__, e)
          PY
